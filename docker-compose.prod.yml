# Production orchestration — all services use pre-built GHCR images.
#
# GitHub Actions builds and pushes three images on every merge to main:
#   ghcr.io/<owner>/<repo>          → API
#   ghcr.io/<owner>/<repo>-worker   → background worker
#   ghcr.io/<owner>/<repo>-frontend → Next.js frontend
#
# server/deploy.sh (called by the deploy job) updates API_IMAGE, WORKER_IMAGE,
# and FRONTEND_IMAGE in /opt/wcq/.env before restarting containers.
#
# Initial server setup:
#   bash server/setup.sh
#
# Manual rolling update:
#   API_IMAGE=... WORKER_IMAGE=... FRONTEND_IMAGE=... bash server/deploy.sh
#
# Tail logs:
#   docker compose -f docker-compose.prod.yml logs -f api

networks:
  wcq-net:
    # Fixed name so docker-compose.observability.yml can join via `external: true`
    # regardless of the Compose project name.
    name: wcq-net
    driver: bridge

volumes:
  redis-data:

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --aof-use-rdb-preamble yes
    volumes:
      - redis-data:/data
    networks: [wcq-net]
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  3s
      retries:  5

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      # ── Database (Supabase — Session-mode pooler, supports advisory locks) ──
      WCQ_DATABASE_DSN:           ${WCQ_DATABASE_DSN}
      WCQ_DATABASE_MAXOPENCONNS:  "20"
      # ── Redis ────────────────────────────────────────────────────────────────
      WCQ_REDIS_ADDR:             redis:6379
      WCQ_REDIS_PASSWORD:         ${REDIS_PASSWORD}
      # ── Core ─────────────────────────────────────────────────────────────────
      WCQ_ENVIRONMENT:            production
      WCQ_EVENTBUS_DRIVER:        redis
      WCQ_CORS_ALLOWEDORIGINS:    ${FRONTEND_PUBLIC_URL}
      # ── Auth ─────────────────────────────────────────────────────────────────
      WCQ_CLERK_JWKSURL:          ${CLERK_JWKS_URL}
      WCQ_CLERK_WEBHOOKSECRET:    ${CLERK_WEBHOOK_SECRET}
      # ── Payments ─────────────────────────────────────────────────────────────
      WCQ_PAYMENT_RECURRENTEAPIKEY:        ${RECURRENTE_API_KEY}
      WCQ_PAYMENT_RECURRENTEWEBHOOKSECRET: ${RECURRENTE_WEBHOOK_SECRET}
      WCQ_PAYMENT_PAYPALWEBHOOKID:         ${PAYPAL_WEBHOOK_ID}
      WCQ_PAYMENT_PAYOUTENCRYPTIONKEY:     ${PAYOUT_ENCRYPTION_KEY}
      # ── Email ────────────────────────────────────────────────────────────────
      WCQ_EMAIL_UNSUBSCRIBESECRET: ${EMAIL_UNSUBSCRIBE_SECRET}
      # ── Storage ──────────────────────────────────────────────────────────────
      WCQ_STORAGE_DRIVER:          ${STORAGE_DRIVER}
      WCQ_STORAGE_S3BUCKET:        ${WCQ_STORAGE_S3BUCKET}
      WCQ_STORAGE_S3ENDPOINT:      ${WCQ_STORAGE_S3ENDPOINT}
      WCQ_STORAGE_S3REGION:        ${WCQ_STORAGE_S3REGION}
      WCQ_STORAGE_S3ACCESSKEYID:   ${WCQ_STORAGE_S3ACCESSKEYID}
      WCQ_STORAGE_S3SECRETKEY:     ${WCQ_STORAGE_S3SECRETKEY}
      # ── Observability ────────────────────────────────────────────────────────
      WCQ_METRICS_ENABLED:             "true"
      WCQ_TRACING_ENABLED:             "true"
      WCQ_TRACING_OTLPENDPOINT:        http://tempo:4318
      WCQ_OBSERVABILITY_TEMPOURL:      http://tempo:4318
      WCQ_OBSERVABILITY_PROMETHEUSURL: http://prometheus:9090
      WCQ_METRICSBINDADDR:             :9091
      # ── n8n integration ──────────────────────────────────────────────────────
      WCQ_N8N_BASEURL:        http://n8n:5678
      WCQ_N8N_WEBHOOKURL:     http://n8n:5678/webhook
      WCQ_N8N_APIKEY:         ${N8N_API_KEY}
      # HMAC-SHA256 key for signing outbound webhook calls to n8n.
      # Must match N8N_WEBHOOK_SECRET in docker-compose.observability.yml.
      WCQ_N8N_WEBHOOKSECRET:  ${N8N_WEBHOOK_SECRET}
      # ── GC tuning — API budget ~2 GB on Hetzner CX53 ────────────────────────
      GOMEMLIMIT: "1800MiB"
      GOGC:       "100"
    ports:
      - "127.0.0.1:8080:8080"  # Caddy reverse-proxies externally; loopback only
      - "127.0.0.1:9091:9091"  # Prometheus scrape endpoint; loopback only
    volumes:
      - /opt/wcq/certs/supabase-ca.crt:/certs/supabase-ca.crt:ro
    depends_on:
      redis: { condition: service_healthy }
    networks: [wcq-net]
    healthcheck:
      # /health/ready waits for DB migrations and connection pool warm-up.
      # Allow 30s start_period: migrations can take several seconds on first deploy.
      test:         ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval:     15s
      timeout:      5s
      start_period: 30s
      retries:      3

  worker:
    image: ${WORKER_IMAGE}
    restart: unless-stopped
    environment:
      WCQ_DATABASE_DSN:           ${WCQ_DATABASE_DSN}
      WCQ_REDIS_ADDR:             redis:6379
      WCQ_REDIS_PASSWORD:         ${REDIS_PASSWORD}
      WCQ_ENVIRONMENT:            production
      WCQ_EVENTBUS_DRIVER:        redis
      WCQ_METRICS_ENABLED:        "true"
      WCQ_TRACING_ENABLED:        "true"
      WCQ_TRACING_OTLPENDPOINT:   http://tempo:4318
      WCQ_OBSERVABILITY_TEMPOURL: http://tempo:4318
      WCQ_N8N_BASEURL:            http://n8n:5678
      WCQ_N8N_WEBHOOKURL:         http://n8n:5678/webhook
      WCQ_N8N_APIKEY:             ${N8N_API_KEY}
      WCQ_N8N_WEBHOOKSECRET:      ${N8N_WEBHOOK_SECRET}
      # ── Email ────────────────────────────────────────────────────────────────
      WCQ_EMAIL_RESENDAPIKEY:     ${RESEND_API_KEY}
      # ── Web Push ─────────────────────────────────────────────────────────────
      WCQ_WEBPUSH_VAPIDPRIVATEKEY: ${VAPID_PRIVATE_KEY}
      # ── GC tuning — worker budget ~1 GB ─────────────────────────────────────
      GOMEMLIMIT: "900MiB"
      GOGC:       "100"
    ports:
      - "127.0.0.1:8081:8081"  # Prometheus scrape + health check; loopback only
    volumes:
      - /opt/wcq/certs/supabase-ca.crt:/certs/supabase-ca.crt:ro
    depends_on:
      redis: { condition: service_healthy }
    networks: [wcq-net]
    healthcheck:
      test:         ["CMD", "wget", "-qO-", "http://localhost:8081/health/ready"]
      interval:     15s
      timeout:      5s
      start_period: 20s
      retries:      3

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:   ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY:                    ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL:       /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL:       /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /onboarding
      NEXT_PUBLIC_APP_URL:                 ${FRONTEND_PUBLIC_URL}
      NEXT_PUBLIC_PAYPAL_CLIENT_ID:        ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET:                ${PAYPAL_CLIENT_SECRET}
      # BFF proxy: Next.js server-side routes call the API via this internal URL.
      BACKEND_INTERNAL_URL:                http://api:8080
    ports:
      - "127.0.0.1:3000:3000"  # Caddy reverse-proxies externally; loopback only
    depends_on:
      api: { condition: service_healthy }
    networks: [wcq-net]
