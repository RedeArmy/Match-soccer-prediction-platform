# Deploy pipeline — production build and deploy triggered on merge to main.
#
# Triggers:
#   pull_request → main : runs the test job only, satisfying the branch
#                         protection required status check "Test" so the PR
#                         can be merged. docker/deploy jobs are skipped.
#   push → main         : runs the full pipeline after the PR is merged.
#
# Job graph (push only):
#   test  →  docker          ──┐
#          ↘  docker-worker    ├──  deploy
#          ↘  docker-frontend ─┘
#
# test:            re-runs the full test suite before building the image.
#                  Production deployments must never skip the test gate, even
#                  when the CI pipeline already passed on the PR — the merge
#                  commit is a new artefact and must be verified independently.
#                  Also runs on pull_request so the "Test" required status check
#                  is satisfied and the PR can be merged.
#
# docker:          builds the API Docker image and pushes it to GHCR, tagged
#                  with the short commit SHA (immutable) and `latest` (moving).
#                  Skipped on pull_request events.
#
# docker-worker:   builds the worker Docker image and pushes it to GHCR under
#                  <repo>-worker, using the same tagging strategy.
#                  Skipped on pull_request events.
#
# docker-frontend: builds the Next.js frontend image and pushes it to GHCR
#                  under <repo>-frontend. Requires the NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
#                  repository variable (public Clerk key, available at build time).
#                  Skipped on pull_request events.
#
# deploy:          SSH rolling deploy to Hetzner CX53. Copies server/deploy.sh
#                  to the server and executes it with the new image tags.
#                  Gate: set repository variable HETZNER_DEPLOY_ENABLED=true
#                  and configure the four HETZNER_SSH_* secrets (see server/.env.example).
#                  Skipped on pull_request events.
#
# Registry: ghcr.io/<owner>/<repo>
# No extra secrets are required for GHCR — GITHUB_TOKEN has write access to
# the package registry for the same repository.

name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # --------------------------------------------------------------------------
  # Test gate — must pass before the Docker image is built
  # --------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: make test

      - name: Integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: make test-integration

      # Validate all 15 n8n workflow JSON files: structure, node IDs,
      # webhook path uniqueness, and connection graph integrity.
      - name: Validate n8n workflows
        run: python3 scripts/validate-n8n-workflows.py observability/n8n/workflows

  # --------------------------------------------------------------------------
  # Update benchmark baseline on every main merge so the drift report in CI
  # always compares against recent performance rather than a stale snapshot.
  # Skipped on pull_request events (only runs on push → main).
  #
  # The baseline is pushed to develop, not to main, because:
  #   1. main has branch-protection rules that require a PR — direct pushes
  #      are rejected even from github-actions[bot].
  #   2. The drift report in ci.yml runs on PRs targeting develop, so the
  #      baseline must live on develop for the comparison to be meaningful.
  #
  # [skip ci] in the commit message prevents this commit from triggering a
  # recursive CI run on develop.
  # --------------------------------------------------------------------------
  bench-baseline:
    name: Update benchmark baseline
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks and save baseline
        run: make bench-save && cp .bench/current.txt .bench/baseline.txt

      - name: Commit updated baseline to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .bench/baseline.txt
          git diff --staged --quiet || git commit -m "chore: update benchmark baseline [skip ci]"
          git push origin develop

  # --------------------------------------------------------------------------
  # Build and push API Docker image to GitHub Container Registry
  # --------------------------------------------------------------------------
  docker:
    name: Build & Push API Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    # packages: write is required to push images to ghcr.io.
    # contents: read is the minimum required to checkout the repository.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI image references must be fully lowercase. github.repository may
      # contain uppercase letters (e.g. "RedeArmy/Match-soccer-prediction-platform"),
      # which Trivy and some registries reject with "could not parse reference".
      - name: Compute lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> $GITHUB_OUTPUT

      # Derives two tags from the current commit:
      #   - short SHA (e.g. a1b2c3d) — immutable, used for rollbacks
      #   - latest                   — always points to the most recent build
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      # Buildx is required to use the GitHub Actions cache backend.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # cache-from / cache-to use the GitHub Actions Cache API so that Docker
      # layer caches persist across workflow runs. The `go mod download` layer —
      # the slowest step in the multi-stage build — is reused on subsequent
      # runs as long as go.sum does not change, cutting build times by ~60%.
      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the pushed image for known OS and library CVEs.
      # exit-code: '1' blocks the deploy pipeline on CRITICAL findings.
      # The image-ref uses the short SHA tag (immutable) from the meta step.
      - name: Scan API image for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  # --------------------------------------------------------------------------
  # Build and push worker Docker image to GitHub Container Registry
  # --------------------------------------------------------------------------
  docker-worker:
    name: Build & Push Worker Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI image references must be fully lowercase — same reason as the API job.
      - name: Compute lowercase worker image name
        id: image-worker
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-worker" \
            >> $GITHUB_OUTPUT

      # The worker image is pushed to <repo>-worker so it is distinct from the
      # API image while living in the same registry namespace.
      - name: Extract worker image metadata
        id: meta-worker
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ steps.image-worker.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push worker
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan worker image for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-worker.outputs.name }}:${{ steps.meta-worker.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  # --------------------------------------------------------------------------
  # Build and push frontend Docker image to GitHub Container Registry
  # --------------------------------------------------------------------------
  docker-frontend:
    name: Build & Push Frontend Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI image references must be fully lowercase — same reason as the API job.
      - name: Compute lowercase frontend image name
        id: image-frontend
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-frontend" \
            >> $GITHUB_OUTPUT

      - name: Extract frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ steps.image-frontend.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # context: frontend/ because the Dockerfile's COPY instructions are
      # relative to the frontend directory. NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      # is a build-time ARG required by Next.js for static-page generation;
      # set it as a repository variable under Settings → Variables → Actions.
      - name: Build and push frontend
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image for CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-frontend.outputs.name }}:${{ steps.meta-frontend.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  # --------------------------------------------------------------------------
  # Rolling SSH deploy to Hetzner CX53
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: [docker, docker-worker, docker-frontend]
    # Gate: set repository variable HETZNER_DEPLOY_ENABLED=true to activate.
    # The `secrets` context is not available in job-level `if` conditions, so
    # a repository variable is used as the gate instead.
    # To activate:  Settings → Variables → Actions → HETZNER_DEPLOY_ENABLED = true
    # Also required: HETZNER_SSH_HOST, HETZNER_SSH_USER, HETZNER_SSH_KEY,
    #                HETZNER_SSH_KNOWN_HOST secrets (see server/.env.example).
    if: github.event_name == 'push' && vars.HETZNER_DEPLOY_ENABLED == 'true'

    # Targeting the `production` environment enables GitHub's deployment
    # tracking (visible in the repository's Deployments sidebar) and allows
    # configuring a required-reviewers approval gate under
    # Settings → Environments → production if manual sign-off is ever needed.
    environment: production

    steps:
      # Compute the short SHA used to tag images in the docker jobs.
      # docker/metadata-action uses the first 7 chars of GITHUB_SHA (type=sha,format=short).
      - name: Compute image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # OCI image references must be fully lowercase — same reason as the docker jobs.
      - name: Compute lowercase image names
        id: images
        run: |
          repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${repo}"             >> $GITHUB_OUTPUT
          echo "worker=ghcr.io/${repo}-worker"   >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/${repo}-frontend" >> $GITHUB_OUTPUT

      - name: Checkout (needed to scp server/deploy.sh)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Write the SSH private key and add the server's known host key.
      # Using HETZNER_SSH_KNOWN_HOST avoids TOFU / MITM risk from ssh-keyscan at deploy time.
      # Obtain the value with: ssh-keyscan <server-ip>
      - name: Configure SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_hetzner
          printf '%s' '${{ secrets.HETZNER_SSH_KEY }}' > ~/.ssh/id_hetzner
          printf '%s\n' '${{ secrets.HETZNER_SSH_KNOWN_HOST }}' >> ~/.ssh/known_hosts

      # Copy the deploy script to the server so it is always the latest version.
      # Then execute it with the new image tags passed as environment variables.
      - name: Deploy via SSH
        env:
          DEPLOY_HOST:    ${{ secrets.HETZNER_SSH_HOST }}
          DEPLOY_USER:    ${{ secrets.HETZNER_SSH_USER }}
          # Secrets injected as env vars so they are masked in logs and never
          # appear as literal strings inside the shell script text.
          GHCR_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER:      ${{ github.actor }}
          API_IMAGE:      ${{ steps.images.outputs.api }}:${{ steps.tag.outputs.sha }}
          WORKER_IMAGE:   ${{ steps.images.outputs.worker }}:${{ steps.tag.outputs.sha }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}:${{ steps.tag.outputs.sha }}
        run: |
          SSH="ssh -i ~/.ssh/id_hetzner -o StrictHostKeyChecking=yes"

          # Keep deploy script in sync with the repo on every deploy.
          scp -i ~/.ssh/id_hetzner \
            server/deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/wcq/server/deploy.sh"

          # Login to GHCR on the server using the ephemeral GITHUB_TOKEN
          # (valid for the duration of this workflow run).
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin"

          # Execute rolling deploy.
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "API_IMAGE='${API_IMAGE}' WORKER_IMAGE='${WORKER_IMAGE}' FRONTEND_IMAGE='${FRONTEND_IMAGE}' \
             bash /opt/wcq/server/deploy.sh"
