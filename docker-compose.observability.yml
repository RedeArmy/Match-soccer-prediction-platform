# docker-compose.observability.yml — Observability stack (dev + production).
#
# Starts Prometheus, Grafana, Tempo, Alertmanager, n8n, and Jaeger alongside
# the core application defined in docker-compose.yml (dev) or
# docker-compose.prod.yml (production).
#
# All services join the wcq-net network (external) so that Prometheus can
# scrape api:9091 / worker:8081 and Tempo can receive OTLP from the API.
#
# Usage (development):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Usage (production — after docker compose -f docker-compose.prod.yml up -d):
#   docker compose -f docker-compose.observability.yml up -d
#
# Required env vars in /opt/wcq/.env (production) or .env (dev):
#   GRAFANA_ADMIN_PASSWORD   — Grafana admin password   (default: admin)
#   GRAFANA_ROOT_URL         — public Grafana URL        (default: http://localhost:3001)
#   N8N_ENCRYPTION_KEY       — n8n credential encryption key
#   N8N_BASIC_AUTH_USER      — n8n UI username           (default: admin)
#   N8N_BASIC_AUTH_PASS      — n8n UI password           (default: changeme)
#   N8N_WEBHOOK_URL          — public n8n webhook URL    (default: http://localhost:5678/)
#   N8N_PROTOCOL             — http or https             (default: http)
#   PROMETHEUS_CONFIG        — prometheus config filename (default: prometheus.yml)
#                              Set to prometheus.prod.yml in production.

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/${PROMETHEUS_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - wcq-net
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:      admin
      GF_SECURITY_ADMIN_PASSWORD:  ${GRAFANA_ADMIN_PASSWORD:-admin}
      # In production GRAFANA_ROOT_URL should be the public HTTPS URL, e.g.
      # https://grafana.example.com — used for redirect URIs and panel links.
      GF_SERVER_ROOT_URL:          ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_FEATURE_TOGGLES_ENABLE:   traceqlEditor
      # Allow the admin panel to embed Grafana in an iframe.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      # Port 3001 on the host — avoids collision with the frontend on 3000.
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - wcq-net
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:2.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"  # Tempo HTTP API
      - "127.0.0.1:4318:4318"  # OTLP HTTP receiver (api/worker → tempo)
      - "127.0.0.1:4317:4317"  # OTLP gRPC receiver
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    # Tempo must be on wcq-net so it is reachable as "tempo:4318" from the
    # api and worker containers (WCQ_OBSERVABILITY_TEMPOURL=http://tempo:4318).
    networks:
      - wcq-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - wcq-net

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    # Override entrypoint + command to import workflow JSON files before
    # starting n8n. The `--active` flag marks imported workflows as active so
    # n8n registers their webhooks and schedulers on startup.
    #
    # entrypoint must be overridden because n8n 1.49 uses
    # `tini -- /docker-entrypoint.sh` as its default ENTRYPOINT, which passes
    # compose `command` args directly to the n8n CLI — `sh` is not a valid n8n
    # subcommand.  Setting entrypoint to ["sh", "-c"] bypasses the n8n wrapper
    # and runs the shell script directly.
    #
    # Idempotent: n8n 1.49 updates existing workflows by name on re-import.
    # To skip updates on subsequent restarts, append `--skipExisting`.
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo '==> importing n8n workflows...'
        for f in /opt/n8n-workflows/*.json; do
          printf '  %s\n' "$$f"
          tmp=$$(mktemp)
          printf '[' > "$$tmp" && cat "$$f" >> "$$tmp" && printf ']' >> "$$tmp"
          n8n import:workflow --input="$$tmp" 2>&1 | tail -n1 || true
          rm -f "$$tmp"
        done
        echo '==> activating workflows...'
        n8n update:workflow --all --active=true 2>&1 | tail -n1 || true
        echo '==> starting n8n...'
        exec n8n start
    environment:
      # ── Core ──────────────────────────────────────────────────────────────
      DB_TYPE:                 sqlite
      N8N_BASIC_AUTH_ACTIVE:   "true"
      N8N_BASIC_AUTH_USER:     ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASS:-changeme}
      N8N_ENCRYPTION_KEY:      ${N8N_ENCRYPTION_KEY:-dev-encryption-key-change-in-prod}
      N8N_HOST:                n8n
      N8N_PORT:                "5678"
      N8N_PROTOCOL:            ${N8N_PROTOCOL:-http}
      # WEBHOOK_URL is the public-facing base URL n8n uses when generating
      # webhook URLs in the UI. In production set to the public HTTPS domain.
      WEBHOOK_URL:             ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      EXECUTIONS_PROCESS:      main
      N8N_LOG_LEVEL:           info
      # ── SMTP (used by emailSend nodes in all notification workflows) ──────
      # n8n self-hosted exposes process.env.* to Code nodes and $env.* to
      # workflow expressions, so these env vars are usable in all 15 workflows.
      N8N_EMAIL_MODE:          smtp
      N8N_SMTP_HOST:           ${N8N_SMTP_HOST}
      N8N_SMTP_PORT:           ${N8N_SMTP_PORT:-587}
      N8N_SMTP_USER:           ${N8N_SMTP_USER}
      N8N_SMTP_PASS:           ${N8N_SMTP_PASS}
      N8N_SMTP_SENDER:         ${N8N_SMTP_SENDER}
      N8N_SMTP_SSL:            "false"
      # ── Workflow runtime variables ────────────────────────────────────────
      # Read in workflows as:  $env.ADMIN_EMAIL  /  process.env.ADMIN_EMAIL
      ADMIN_EMAIL:             ${N8N_ADMIN_EMAIL}
      COMPLIANCE_EMAIL:        ${N8N_COMPLIANCE_EMAIL}
      # Specialist recipients — used by escalation / alert workflows.
      OPS_EMAIL:                   ${N8N_OPS_EMAIL}
      SENIOR_COMPLIANCE_EMAIL:     ${N8N_SENIOR_COMPLIANCE_EMAIL}
      SANCTIONS_COMPLIANCE_EMAIL:  ${N8N_SANCTIONS_COMPLIANCE_EMAIL}
      # process.env.APP_BASE_URL used in user-facing email links (e.g. kyc-approved)
      APP_BASE_URL:            ${FRONTEND_PUBLIC_URL}
      # ADMIN_BASE_URL is used in KYC/compliance email bodies to build deep-links
      # into the admin panel (e.g. process.env.ADMIN_BASE_URL + "/admin/kyc/queue").
      # Typically identical to APP_BASE_URL when the admin panel is part of the
      # same Next.js app; override separately when it lives on a different domain.
      ADMIN_BASE_URL:          ${N8N_ADMIN_BASE_URL:-${FRONTEND_PUBLIC_URL}}
      # API_BASE_URL is the internal backend URL n8n uses to call the REST API.
      # Within the Docker network this is always http://api:8080; set
      # N8N_API_BASE_URL only if you need to override it (e.g. in local dev
      # where n8n runs outside Docker and must reach the host).
      API_BASE_URL:            ${N8N_API_BASE_URL:-http://api:8080}
      # INTERNAL_API_KEY is a shared secret that n8n presents in the
      # "Authorization: Bearer <key>" header when polling the backend on its
      # scheduled workflows (e.g. kyc-review-reminder).
      # Generate with:  openssl rand -hex 32
      # The backend must validate this key on the affected routes; see the
      # WCQ_N8N_INTERNALKEY env var on the api / worker services.
      INTERNAL_API_KEY:        ${N8N_INTERNAL_API_KEY}
      # ── Webhook HMAC signing ─────────────────────────────────────────────
      # Must match WCQ_N8N_WEBHOOKSECRET on the backend side.
      N8N_WEBHOOK_SECRET:      ${N8N_WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow JSON files mounted read-only; the startup import script reads them.
      - ./observability/n8n/workflows:/opt/n8n-workflows:ro
    # n8n must be on wcq-net so the API can call http://n8n:5678 (WCQ_N8N_BASEURL).
    networks:
      - wcq-net
    healthcheck:
      test:         ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval:     15s
      timeout:      5s
      start_period: 30s
      retries:      3

  jaeger:
    image: jaegertracing/all-in-one:1.58
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger UI
      - "127.0.0.1:14268:14268"  # Jaeger HTTP collector
    networks:
      - wcq-net

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local
  alertmanager_data:
    driver: local
  n8n_data:
    driver: local

networks:
  wcq-net:
    # wcq-net is created by docker-compose.yml (dev) or docker-compose.prod.yml
    # (production) with `name: wcq-net`. All observability services join it so
    # they can communicate with api and worker containers by service name.
    external: true
    name: wcq-net
