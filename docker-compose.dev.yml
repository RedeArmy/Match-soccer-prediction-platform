# Development overrides — frontend with hot reload.
# Backend runs locally via `make run` or your IDE.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
      target:     dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY:                  ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL:     /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL:     /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:  /dashboard
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:  /onboarding
      # Points to the host machine where the Go backend runs locally
      BACKEND_INTERNAL_URL: http://host.docker.internal:8080
    # host.docker.internal does not resolve automatically on Linux — this
    # maps it to the host gateway so the frontend container can reach the
    # locally-running Go backend.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - quiniela_net
